<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Connections - Midnight Edition</title>
  <style>
    :root {
      /* Difficulty Colors (Standard NYT style but vibrant) */
      --yellow: #f9df6d;
      --green: #a0c35a;
      --blue: #b0c4ef;
      --purple: #ba81c5;
      
      /* Difficulty Text Colors (Midnight Overlay) */
      --text-yellow: #161a24;
      --text-green: #1b3300;
      --text-blue: #0a1931;
      --text-purple: #2d004d;

      /* Global Theme Colors */
      --bg-color: #0a0b10;
      --card-bg: #161a24;
      --accent-primary: #00f2ff; /* Electric Cyan */
      --accent-secondary: #7000ff; /* Deep Violet */
      --text-main: #e0e6ed;
      --text-muted: #8892b0;
    }

    body { 
      background: var(--bg-color); 
      color: var(--text-main); 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      text-align: center; 
      padding: 20px; margin: 0; overflow-x: hidden;
    }

    #overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: var(--bg-color); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    h1 { 
      font-size: clamp(32px, 8vw, 48px); margin: 20px 0; letter-spacing: -1px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;
    }
    
    #grid { 
      display: grid; grid-template-columns: repeat(4, 1fr); 
      gap: 12px; max-width: 600px; margin: 30px auto; 
    }

    @media (max-width: 480px) { #grid { grid-template-columns: repeat(2, 1fr); } }

    .word { 
      background: var(--card-bg); padding: 22px 10px; border-radius: 12px; 
      cursor: pointer; font-size: 15px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
      border: 1px solid #2d3343; display: flex; align-items: center; justify-content: center;
      text-transform: uppercase; font-weight: 700; color: var(--text-main);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); letter-spacing: 0.5px;
    }
    
    .word:hover:not(.disabled) { border-color: var(--accent-primary); transform: translateY(-2px); }

    /* Updated Selected State: Dark on Cyan */
    .word.selected { 
      background: var(--accent-primary); color: #06080a; border-color: #fff;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
    }

    .word.disabled { cursor: default; opacity: 1; border: none; }

    /* Midnight Overlay Difficulty Styles */
    .word.solved-yellow { background: var(--yellow) !important; color: var(--text-yellow) !important; }
    .word.solved-green { background: var(--green) !important; color: var(--text-green) !important; }
    .word.solved-blue { background: var(--blue) !important; color: var(--text-blue) !important; }
    .word.solved-purple { background: var(--purple) !important; color: var(--text-purple) !important; }

    #submit, #start-btn, #new-game { 
      margin: 10px; padding: 14px 40px; font-size: 16px; 
      background: transparent; border: 2px solid var(--accent-primary); 
      color: var(--accent-primary); border-radius: 50px; cursor: pointer; 
      font-weight: 800; text-transform: uppercase; transition: all 0.3s;
      letter-spacing: 1px;
    }

    #submit:hover:not(:disabled), #start-btn:hover { 
      background: var(--accent-primary); color: #06080a;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
    }

    #submit:disabled { border-color: #333; color: #333; cursor: not-allowed; }

    /* New Game Button Variant */
    #new-game { display: none; border-color: var(--accent-secondary); color: var(--accent-secondary); }
    #new-game:hover { background: var(--accent-secondary); color: white; box-shadow: 0 0 20px rgba(112, 0, 255, 0.4); }

    #message { font-size: 18px; margin: 20px; min-height: 28px; color: var(--text-muted); font-weight: 500; }
    #lives-container { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 5px; }
    #lives { color: #ff4b4b; font-weight: bold; }
    
    .status-dots { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .dot { width: 14px; height: 14px; border-radius: 4px; background: #1f2430; border: 1px solid #2d3343; }
    .dot.yellow { background: var(--yellow); border: none; }
    .dot.green { background: var(--green); border: none; }
    .dot.blue { background: var(--blue); border: none; }
    .dot.purple { background: var(--purple); border: none; }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>Mega Connections</h1>
    <button id="start-btn">Initialize Game</button>
  </div>

  <h1>Mega Connections</h1>
  <div id="lives-container">Mistakes remaining: <span id="lives">4</span></div>
  <div id="grid"></div>
  <button id="submit">Submit Guess</button>
  <div><button id="new-game">Generate New Puzzle</button></div>
  <div id="message"></div>
  <div class="status-dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, vol) {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
      select: () => playTone(600, 'sine', 0.05, 0.05),
      deselect: () => playTone(400, 'sine', 0.05, 0.05),
      correct: () => {
        playTone(523.25, 'triangle', 0.2, 0.05);
        setTimeout(() => playTone(783.99, 'triangle', 0.4, 0.05), 150);
      },
      wrong: () => { playTone(150, 'sawtooth', 0.4, 0.05); },
      win: () => { [523, 659, 783, 1046].forEach((n, i) => setTimeout(() => playTone(n, 'sine', 0.6, 0.1), i * 150)); }
    };

    const categoryPool = {
      yellow: [
        { name: "Fruits", words: ["APPLE", "BANANA", "CHERRY", "DATE"] },
        { name: "Cleaning Tasks", words: ["DUST", "MOP", "SWEEP", "VACUUM"] },
        { name: "Trees", words: ["ASH", "CEDAR", "MAPLE", "PINE"] },
        { name: "Metals", words: ["IRON", "LEAD", "TIN", "ZINC"] }
      ],
      green: [
        { name: "Chess Pieces", words: ["KING", "QUEEN", "ROOK", "PAWN"] },
        { name: "Baseball Gear", words: ["BAT", "BALL", "GLOVE", "BASE"] },
        { name: "Greek Letters", words: ["BETA", "CHI", "DELTA", "IOTA"] },
        { name: "Insects", words: ["ANT", "BEETLE", "MANTIS", "TERMITE"] }
      ],
      blue: [
        { name: "Strings", words: ["GUITAR", "VIOLIN", "CELLO", "BASS"] },
        { name: "Airlines", words: ["DELTA", "FRONTIER", "SPIRIT", "UNITED"] },
        { name: "Clouds", words: ["CIRRUS", "CUMULUS", "NIMBUS", "STRATUS"] },
        { name: "Grains", words: ["BARLEY", "OAT", "RYE", "SPELT"] }
      ],
      purple: [
        { name: "Silent 'G'", words: ["GNAT", "GNAW", "GNOME", "PHLEGM"] },
        { name: "____ Queen", words: ["DAIRY", "DANCING", "DRAG", "MAY"] },
        { name: "Name Countries", words: ["CHAD", "GEORGIA", "JORDAN", "TOGO"] },
        { name: "Board Games", words: ["STICK", "JACK", "MARBLE", "DOMINO"] }
      ]
    };

    let selected = [], lives = 4, solvedCount = 0, gameGroups = [];
    const grid = document.getElementById("grid"), message = document.getElementById("message");
    const submitBtn = document.getElementById("submit"), newGameBtn = document.getElementById("new-game");

    function initGame() {
      grid.innerHTML = ""; selected = []; lives = 4; solvedCount = 0;
      submitBtn.disabled = false; newGameBtn.style.display = "none"; message.textContent = "";
      document.getElementById("lives").textContent = lives;
      document.querySelectorAll('.dot').forEach(d => d.className = "dot");

      gameGroups = [
        {...categoryPool.yellow[Math.floor(Math.random() * categoryPool.yellow.length)], level: 'yellow'},
        {...categoryPool.green[Math.floor(Math.random() * categoryPool.green.length)], level: 'green'},
        {...categoryPool.blue[Math.floor(Math.random() * categoryPool.blue.length)], level: 'blue'},
        {...categoryPool.purple[Math.floor(Math.random() * categoryPool.purple.length)], level: 'purple'}
      ];

      let allWords = gameGroups.flatMap(g => g.words.map(w => ({text: w, level: g.level})));
      for (let i = allWords.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allWords[i], allWords[j]] = [allWords[j], allWords[i]];
      }

      allWords.forEach(wordObj => {
        const div = document.createElement("div");
        div.className = "word"; div.textContent = wordObj.text;
        div.onclick = () => {
          if (div.classList.contains('disabled')) return;
          if (div.classList.contains('selected')) {
            div.classList.remove('selected');
            selected = selected.filter(w => w !== div.textContent);
            sounds.deselect();
          } else if (selected.length < 4) {
            div.classList.add('selected');
            selected.push(div.textContent);
            sounds.select();
          }
        };
        grid.appendChild(div);
      });
    }

    document.getElementById('start-btn').onclick = () => { audioCtx.resume(); document.getElementById('overlay').style.display = 'none'; initGame(); };
    newGameBtn.onclick = initGame;

    submitBtn.onclick = () => {
      if (selected.length !== 4) return;
      let match = null, bestIntersection = 0;
      gameGroups.forEach(g => {
        const intersection = g.words.filter(w => selected.includes(w)).length;
        if (intersection === 4) match = g;
        if (intersection > bestIntersection) bestIntersection = intersection;
      });

      if (match) {
        sounds.correct();
        message.textContent = match.name;
        solvedCount++;
        const wordDivs = Array.from(grid.children);
        selected.forEach(wordText => {
          const el = wordDivs.find(d => d.textContent === wordText);
          el.classList.add('disabled', `solved-${match.level}`);
          el.classList.remove('selected');
        });
        document.querySelectorAll('.dot')[solvedCount-1].className = `dot ${match.level}`;
        selected = [];
        if (solvedCount === 4) {
          sounds.win(); message.textContent = "Perfect! Connection Restored.";
          submitBtn.disabled = true; newGameBtn.style.display = "inline-block";
        }
      } else {
        lives--; sounds.wrong();
        document.getElementById("lives").textContent = lives;
        message.textContent = bestIntersection === 3 ? "One away!" : "Next time...";
        if (lives <= 0) {
          message.textContent = "System Failure. Game Over.";
          submitBtn.disabled = true; newGameBtn.style.display = "inline-block";
        }
      }
    };
  </script>
</body>
</html>
